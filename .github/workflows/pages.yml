name: Deploy ke GitHub Pages

# Setiap push ke main: aplikasi DIPERIKSA dulu (job "periksa"). Bila pemeriksaan gagal, deploy dibatalkan dan
# situs tetap memakai versi sebelumnya yang sehat.
# Kembali ke versi lama (rollback) tanpa mengubah kode: Actions → "Deploy ke GitHub Pages" → Run workflow →
# isi "versi" dengan kode commit lama (lihat README bagian "Kembali ke versi sebelumnya").
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      versi:
        description: 'Kode commit / tag yang ditayangkan (kosongkan = versi terbaru di main)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  periksa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ambil folder web/ dari versi yang diminta
        if: inputs.versi != ''
        env:
          VERSI: ${{ inputs.versi }}
        run: rm -rf web && git checkout "$VERSI" -- web
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Periksa penulisan kode (salah ketik / kurung kurang)
        run: for f in web/*.js; do node --check "$f" || exit 1; echo "✓ $f"; done
      - name: Pasang browser uji
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Buka aplikasi di browser tanpa error
        run: node .github/scripts/cek-aplikasi.mjs

  deploy:
    needs: periksa
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ambil folder web/ dari versi yang diminta
        if: inputs.versi != ''
        env:
          VERSI: ${{ inputs.versi }}
        run: rm -rf web && git checkout "$VERSI" -- web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
